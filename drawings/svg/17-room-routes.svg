idth="1.4" stroke-dasharray="6 4" /><polyline points="454.759,642.134 454.695,636.764 454.35,631.403 453.725,626.068 452.822,620.774 451.642,615.533 450.191,610.362 448.47,605.274 446.486,600.282 444.243,595.402 441.747,590.645 439.007,586.026 436.028,581.556 432.819,577.248 429.389,573.114 425.748,569.166 421.905,565.413 417.871,561.867 413.657,558.536 409.274,555.431 404.735,552.559 400.051,549.929 395.237,547.548 390.304,545.422 385.267,543.557 380.139,541.958 374.935,540.629 369.668,539.575 364.353,538.798 359.005,538.3 353.638,538.083" fill="none" stroke="#b36b36" stroke-dasharray="3 4"/><rect x="455.345" y="639.203" width="68" height="2.93103" fill="#cdbb9e" stroke="#b36b36" stroke-width="1.4" /><rect x="521.879" y="572.669" width="2.93103" height="68" fill="none" stroke="#b36b36" stroke-width="1.4" stroke-dasharray="6 4" /><polyline points="455.345,642.134 455.361,638.574 455.564,635.019 455.953,631.479 456.526,627.964 457.283,624.485 458.22,621.05 459.336,617.668 460.628,614.35 462.091,611.103 463.722,607.938 465.517,604.863 467.47,601.885 469.577,599.014 471.83,596.257 474.225,593.622 476.755,591.116 479.412,588.745 482.19,586.517 485.08,584.438 488.076,582.512 491.168,580.746 494.348,579.144 497.608,577.711 500.938,576.45 504.33,575.365 507.773,574.46 511.26,573.735 514.779,573.195 518.322,572.839 521.879,572.669" fill="none" stroke="#b36b36" stroke-dasharray="3 4"/></g><polyline points="168.103,706.207 402.586,706.207 402.586,530.345" fill="none" stroke="#34735e" stroke-width="2"/><text x="940" y="150" font-size="20" fill="#233e38" text-anchor="start">入户至家庭厅</text><polyline points="168.103,706.207 402.586,706.207 402.586,530.345 631.207,530.345 631.207,202.069" fill="none" stroke="#467896" stroke-width="2"/><text x="940" y="215" font-size="20" fill="#233e38" text-anchor="start">入户至主卧A</text><polyline points="168.103,706.207 402.586,706.207 402.586,530.345 631.207,530.345 631.207,542.069 748.448,542.069" fill="none" stroke="#b36b36" stroke-width="2"/><text x="940" y="280" font-size="20" fill="#233e38" text-anchor="start">入户至卧室B</text><text x="940" y="370" font-size="16" fill="#233e38" text-anchor="start">鞋柜关闭，家庭厅子母门全开</text><text x="940" y="416" font-size="16" fill="#233e38" text-anchor="start">相关房门按90°固定状态计算</text><text x="940" y="462" font-size="16" fill="#233e38" text-anchor="start">600方篮，额外10／侧复核</text><text x="940" y="508" font-size="16" fill="#233e38" text-anchor="start">三条路径均无概念实体命中</text><text x="940" y="554" font-size="16" fill="#233e38" text-anchor="start">原西铰A门87–90°碰墙</text><text x="940" y="600" font-size="16" fill="#233e38" text-anchor="start">东铰复算见逐室报告</text><text x="940" y="646" font-size="16" fill="#233e38" text-anchor="start">须复核实物把手和开启限位</text><text x="940" y="692" font-size="16" fill="#233e38" text-anchor="start">不移动门洞来规避问题</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">路线从同一入户外侧点开始；图上折线为篮中心。完整扫掠矩形和逐段坐标保存于核验数据。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">家庭厅主门全开时浅柜南半段人员操作受限，关门取物与携篮通行必须错时。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">A门的原有五金冲突单列为暂停五金定稿项；图上路线无命中不等于房门可按假定五金安装。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.4；三维模型已同步；本轮未生成渲染图。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>