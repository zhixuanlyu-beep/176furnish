stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">客卫边界2380×1354保持；西侧900×1354淋浴，东侧南端名义700入口。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">中央800×600换衣占位，单人顺序共享；南侧800门洞，外置上吊门向西停靠。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">全家淋浴需错峰；洗澡时其他卧室使用客卫受影响，可等待或借用主卫。检修停用时无第二淋浴。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.5；三维模型已同步；本轮未生成渲染图。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>