<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img"><title>柜墙剖面与收口 · 概念构造</title><rect width="100%" height="100%" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="48" font-size="27" fill="#233e38" text-anchor="start">R10.4  /  柜墙剖面与收口 · 概念构造</text><text x="42" y="79" font-size="15" fill="#b36b36" text-anchor="start">单位：mm · 概念尺寸，非现场实测／下单尺寸</text><rect x="130" y="240" width="4.5" height="540" fill="#b69c7b" stroke="#233e38" stroke-width="1.4" data-depth-mm="20"/><text x="290" y="190" font-size="17" fill="#233e38" text-anchor="start">20门板</text><rect x="134.5" y="240" width="74.25" height="540" fill="#e2e8db" stroke="#233e38" stroke-width="1.4" data-depth-mm="330"/><text x="290" y="208" font-size="17" fill="#233e38" text-anchor="start">330有效鞋深</text><rect x="208.75" y="240" width="11.25" height="540" fill="#7f9183" stroke="#233e38" stroke-width="1.4" data-depth-mm="50"/><text x="290" y="505" font-size="17" fill="#233e38" text-anchor="start">50背衬构造</text><rect x="130" y="150" width="90" height="90" fill="#dad6ca" stroke="#233e38" stroke-width="1.4" /><path d="M130,788 V828.0 M220.0,788 V828.0 M130,823.0 H220.0" fill="none" stroke="#467896"/><text x="175" y="817" font-size="14" fill="#467896" text-anchor="middle">400总深</text><text x="80" y="150" font-size="18" fill="#233e38" text-anchor="start">南／玄关</text><text x="280" y="150" font-size="18" fill="#233e38" text-anchor="start">北／家庭厅</text><text x="580" y="150" font-size="21" fill="#233e38" text-anchor="start">原1010短墙段的平面分配</text><rect x="590" y="250" width="16.5" height="66" fill="#dfe7dc" stroke="#233e38" stroke-width="1.4" data-return-width-mm="30"/><text x="590" y="380" font-size="18" fill="#233e38" text-anchor="start">西收口30</text><rect x="606.5" y="250" width="495" height="66" fill="#dfe7dc" stroke="#233e38" stroke-width="1.4" data-return-width-mm="900"/><text x="590" y="422" font-size="18" fill="#233e38" text-anchor="start">柜体900</text><rect x="1101.5" y="250" width="44" height="66" fill="#dfe7dc" stroke="#233e38" stroke-width="1.4" data-return-width-mm="80"/><text x="590" y="464" font-size="18" fill="#233e38" text-anchor="start">门侧收口80</text><text x="590" y="540" font-size="21" fill="#233e38" text-anchor="start">30＋900＋80＝1010，1500门洞不变</text><text x="590" y="600" font-size="18" fill="#233e38" text-anchor="start">柜背Y3124；浅柜南端Y3174 → 50间隔</text><text x="590" y="650" font-size="18" fill="#233e38" text-anchor="start">原墙北面Y2844 → 柜背进入家庭厅280</text><text x="590" y="700" font-size="18" fill="#233e38" text-anchor="start">2400以上400封闭收口，按2800概念层高</text><text x="590" y="750" font-size="18" fill="#233e38" text-anchor="start">背衬独立固定、封闭密封；不作承重或隔声评级</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">50mm背衬为构造总占位，并不等于一块50mm背板；加固、连接件与现有墙框关系待深化。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">西侧30与门侧80均为名义收口宽；不得侵占1500mm门洞，线路迁改及门框固定须现场核实。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">结构和固定方式未通过现场确认前，不形成可施工拆墙结论，也不增加柜深来规避问题。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.4；三维模型已同步；本轮未生成渲染图。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>