#e7dfd2" stroke="#34735e" stroke-width="1.4" data-object="child_desk" data-box="2776,2844,1200,600"/><polygon points="452.191,743.291 547.906,743.291 547.906,647.577 452.191,647.577" fill="#e7dfd2" stroke="#34735e" stroke-width="1.4" data-object="child_chair" data-box="3376,2994,500,500"/><polygon points="452.191,737.549 452.959,740.416 455.067,742.524 457.934,743.291 542.163,743.291 545.03,742.524 547.138,740.416 547.906,737.549 547.906,653.32 547.138,650.452 545.03,648.344 542.163,647.577 457.934,647.577 455.067,648.344 452.959,650.452 452.191,653.32" fill="none" stroke="#758c83" stroke-width="0.7" data-component="child_chair_seat"/><polygon points="452.191,653.32 452.703,655.232 454.108,656.637 456.02,657.149 544.077,657.149 545.989,656.637 547.394,655.232 547.906,653.32 547.906,651.406 547.394,649.494 545.989,648.089 544.077,647.577 456.02,647.577 454.108,648.089 452.703,649.494 452.191,651.406" fill="none" stroke="#758c83" stroke-width="0.7" data-component="child_chair_back"/></g><rect x="206.014" y="149.289" width="248.857" height="402" fill="none" stroke="#b6473b" stroke-width="1.4" stroke-dasharray="6 4" /><path d="M452.19142857142856,647.5771428571428 H487.19142857142856 M452.19142857142856,551.2885714285715 H487.19142857142856 M482.19142857142856,647.5771428571428 V551.2885714285715" fill="none" stroke="#467896"/><text x="489.191" y="599.433" font-size="14" fill="#467896" text-anchor="start">503</text><text x="770" y="150" font-size="18" fill="#233e38" text-anchor="start">床垫 ≠ 床架最大外尺寸</text><text x="770" y="198" font-size="18" fill="#233e38" text-anchor="start">红虚线：假设外伸50，非选型</text><text x="770" y="246" font-size="18" fill="#233e38" text-anchor="start">床尾名义553；外伸50后503</text><text x="770" y="294" font-size="18" fill="#233e38" text-anchor="start">只余3mm，不构成舒适通路</text><text x="770" y="342" font-size="18" fill="#233e38" text-anchor="start">餐椅座高450；休闲椅430</text><text x="770" y="390" font-size="18" fill="#233e38" text-anchor="start">儿童座高380仅绘图假设</text><text x="770" y="438" font-size="18" fill="#233e38" text-anchor="start">儿童身高及产品调节范围待核</text><text x="770" y="486" font-size="18" fill="#233e38" text-anchor="start">餐桌高750，梁底净高680</text><text x="770" y="534" font-size="18" fill="#233e38" text-anchor="start">岛台/厨房850为试用起点</text><text x="770" y="582" font-size="18" fill="#233e38" text-anchor="start">床架敏感性25/50/100另表</text><text x="770" y="630" font-size="18" fill="#233e38" text-anchor="start">真实尺寸缺失不作安装通过</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">真实床架未锁定；原床位不移动，外伸算例公开床头置物与床架可能冲突，详见床架外伸复算。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">模型座高来自layout逐项输入；总高、座高、桌下净高分列，不再把椅子全设500mm座高。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">儿童桌椅仍待官方产品尺寸及调节范围；不把暂定座高或桌高当作已适配孩子。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.5；三维模型已同步；本轮未生成渲染图。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>