82.9225806451614 H768.1532258064517 M729.1532258064517,541.25 H768.1532258064517 M763.1532258064517,682.9225806451614 V541.25" fill="none" stroke="#467896"/><text x="770.153" y="612.086" font-size="14" fill="#467896" text-anchor="start">1273</text><text x="1090" y="170" font-size="15" fill="#233e38" text-anchor="start">厨房在上方</text><text x="1090" y="213" font-size="15" fill="#233e38" text-anchor="start">岛台：1600×750</text><text x="1090" y="256" font-size="15" fill="#233e38" text-anchor="start">基站西800／水槽东800</text><text x="1090" y="299" font-size="15" fill="#233e38" text-anchor="start">四人桌：1600×750</text><text x="1090" y="342" font-size="15" fill="#233e38" text-anchor="start">咖啡柜：1800×600</text><text x="1090" y="385" font-size="15" fill="#233e38" text-anchor="start">电器高柜：600×600</text><text x="1090" y="428" font-size="15" fill="#233e38" text-anchor="start">冰箱：975×750</text><text x="1090" y="471" font-size="15" fill="#233e38" text-anchor="start">柜列西端距边界100</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">桌椅同步向左600mm，岛槽原位置保留；南墙顺序为咖啡柜—电器高柜—冰箱。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">冰箱至岛台名义间距1273mm；开启600＋站人600后仅余73mm，不是可穿行通道。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">六人状态最右餐椅至冰箱水平间隔250mm；实体和操作状态另见核验图。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.4；三维模型已同步；本轮未生成渲染图。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>