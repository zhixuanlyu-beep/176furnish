4871794871795 M557.8205128205129,354.4871794871795 H968.0769230769231" fill="none" stroke="#467896"/><text x="762.949" y="348.487" font-size="14" fill="#467896" text-anchor="middle">1600控制长度</text><text x="1070" y="175" font-size="16" fill="#233e38" text-anchor="start">STEDIA优先核查</text><text x="1070" y="229" font-size="16" fill="#233e38" text-anchor="start">当前非官方模块</text><text x="1070" y="283" font-size="16" fill="#233e38" text-anchor="start">岛台初选高850</text><text x="1070" y="337" font-size="16" fill="#233e38" text-anchor="start">餐桌独立高750</text><text x="1070" y="391" font-size="16" fill="#233e38" text-anchor="start">高差100</text><text x="1070" y="445" font-size="16" fill="#233e38" text-anchor="start">岛台基站孔取消</text><text x="1070" y="499" font-size="16" fill="#233e38" text-anchor="start">北京渠道有名单</text><text x="1070" y="553" font-size="16" fill="#233e38" text-anchor="start">供货安装保修待核</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">1600×750仅保留空间边界，不把自定义双800柜标成Cleanup；官方模块安装表未取得，暂无合格组合。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">四人日常、六人替代桌均独立承重并靠接；侧封板、踢脚、防水与色调接口待厂家书面方案。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">机器人改查洗烘阳台；600×600候选控制区并非机型净空，装卸检修重叠见基站迁移表。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.5；三维模型已同步；本轮未生成渲染图。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>