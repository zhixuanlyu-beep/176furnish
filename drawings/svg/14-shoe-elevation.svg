<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img"><title>鞋柜立面 · 上下封闭，中间置物</title><rect width="100%" height="100%" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="48" font-size="27" fill="#233e38" text-anchor="start">R10.4  /  鞋柜立面 · 上下封闭，中间置物</text><text x="42" y="79" font-size="15" fill="#b36b36" text-anchor="start">单位：mm · 概念尺寸，非现场实测／下单尺寸</text><rect x="150" y="755.5" width="220.5" height="24.5" fill="#758779" stroke="#233e38" stroke-width="1.4" data-elevation-section="踢脚" data-z0="0" data-z1="100"/><text x="420" y="772.75" font-size="16" fill="#233e38" text-anchor="start">0–100  踢脚</text><rect x="150" y="559.5" width="220.5" height="196" fill="#dce5d9" stroke="#233e38" stroke-width="1.4" data-elevation-section="下封闭鞋区 · 3组" data-z0="100" data-z1="900"/><text x="420" y="662.5" font-size="16" fill="#233e38" text-anchor="start">100–900  下封闭鞋区 · 3组</text><rect x="150" y="473.75" width="220.5" height="85.75" fill="#d7ba96" stroke="#233e38" stroke-width="1.4" data-elevation-section="开放置物格 · 无座位" data-z0="900" data-z1="1250"/><text x="420" y="521.625" font-size="16" fill="#233e38" text-anchor="start">900–1250  开放置物格 · 无座位</text><rect x="150" y="204.25" width="220.5" height="269.5" fill="#dce5d9" stroke="#233e38" stroke-width="1.4" data-elevation-section="上封闭鞋区 · 5组" data-z0="1250" data-z1="2350"/><text x="420" y="344" font-size="16" fill="#233e38" text-anchor="start">1250–2350  上封闭鞋区 · 5组</text><rect x="150" y="192" width="220.5" height="12.25" fill="#758779" stroke="#233e38" stroke-width="1.4" data-elevation-section="顶部构造" data-z0="2350" data-z1="2400"/><text x="420" y="203.125" font-size="16" fill="#233e38" text-anchor="start">2350–2400  顶部构造</text><rect x="150" y="94" width="220.5" height="98" fill="#dad6ca" stroke="#233e38" stroke-width="1.4" data-elevation-section="封闭收口 · 不计储物" data-z0="2400" data-z1="2800"/><text x="420" y="148" font-size="16" fill="#233e38" text-anchor="start">2400–2800  封闭收口 · 不计储物</text><polyline points="260.25,755.5 260.25,559.5" fill="none" stroke="#b36b36" stroke-width="2"/><polyline points="150,690.167 370.5,690.167" fill="none" stroke="#748f7a" stroke-width="2" stroke-dasharray="5 4"/><polyline points="150,624.833 370.5,624.833" fill="none" stroke="#748f7a" stroke-width="2" stroke-dasharray="5 4"/><polyline points="260.25,473.75 260.25,204.25" fill="none" stroke="#b36b36" stroke-width="2"/><polyline points="150,419.85 370.5,419.85" fill="none" stroke="#748f7a" stroke-width="2" stroke-dasharray="5 4"/><polyline points="150,365.95 370.5,365.95" fill="none" stroke="#748f7a" stroke-width="2" stroke-dasharray="5 4"/><polyline points="150,312.05 370.5,312.05" fill="none" stroke="#748f7a" stroke-width="2" stroke-dasharray="5 4"/><polyline points="150,258.15 370.5,258.15" fill="none" stroke="#748f7a" stroke-width="2" stroke-dasharray="5 4"/><path d="M150,790 V820.0 M370.5,790 V820.0 M150,815.0 H370.5" fill="none" stroke="#467896"/><text x="260.25" y="809" font-size="14" fill="#467896" text-anchor="middle">900外宽 · 双门名义450／扇</text><text x="865" y="150" font-size="17" fill="#233e38" text-anchor="start">容量按鞋型模板计算</text><text x="865" y="198" font-size="17" fill="#233e38" text-anchor="start">两侧18板 → 净宽864</text><text x="865" y="246" font-size="17" fill="#233e38" text-anchor="start">每双240宽×330深×180高</text><text x="865" y="294" font-size="17" fill="#233e38" text-anchor="start">每层3双 × 8层 = 理论24双</text><text x="865" y="342" font-size="17" fill="#233e38" text-anchor="start">下层净高约242.7／层</text><text x="865" y="390" font-size="17" fill="#233e38" text-anchor="start">上层净高约198.4／层</text><text x="865" y="438" font-size="17" fill="#233e38" text-anchor="start">拆一块下层板放较高靴：约21双</text><text x="865" y="486" font-size="17" fill="#233e38" text-anchor="start">300宽鞋型：每层2双，共16双</text><text x="865" y="534" font-size="17" fill="#233e38" text-anchor="start">350长鞋：不能按水平摆放适配</text><text x="865" y="582" font-size="17" fill="#233e38" text-anchor="start">鞋盒及长靴须重新调层</text><text x="865" y="630" font-size="17" fill="#233e38" text-anchor="start">25双不作为保证值</text><text x="865" y="678" font-size="17" fill="#233e38" text-anchor="start">通风朝玄关，背面连续封闭</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">图中层板为可调整概念分层；层高按上下板及中间18mm层板扣除，门缝／五金仍待深化。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">330有效深度与330鞋长模板相等，未另留鞋头余量；实鞋试放后再确认下单和容量。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">置物格高350（标高900–1250）；灯具固定在格顶，驱动与接线可检修，不装在活动门板上。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.4；三维模型已同步；本轮未生成渲染图。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>