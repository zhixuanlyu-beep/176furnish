 font-size="16" fill="#233e38" text-anchor="start">1010mm短墙段表达为30西收口＋900鞋柜＋80门侧收口；原短墙性质与门框固定方式须现场核实。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">鞋柜南面Y2724、柜背Y3124，浅柜南端Y3174，间隔50；家庭厅1500门洞保持。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">本图仅表达最新柜墙概念，不代表结构拆除许可；实际条件不成立时暂停，不扩大柜深或移动其他家具。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.5；三维模型已同步；本轮未生成渲染图。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>