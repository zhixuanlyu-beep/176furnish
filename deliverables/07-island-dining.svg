<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 550" role="img" aria-label="岛桌相连与厨房门关闭边界概念"><g font-family="Microsoft YaHei, sans-serif"><text x="570" y="29" font-size="23" fill="#233d36" text-anchor="middle">岛在东、桌向西端接；燃气留原厨房</text><rect x="500" y="60" width="500" height="110" rx="0" fill="#e5eff0" stroke="#82958c" /><text x="750" y="102" font-size="17" fill="#233d36" text-anchor="middle">原厨房：灶 / 水槽 / 洗碗；冰箱已移到入口外</text><line x1="500" y1="60" x2="500" y2="170" stroke="#427f9a" stroke-width="3" stroke-dasharray="7 5"/><line x1="500" y1="170" x2="1000" y2="170" stroke="#427f9a" stroke-width="3" stroke-dasharray="7 5"/><text x="747" y="151" font-size="15" fill="#427f9a" text-anchor="middle">虚线示意可关闭边界，收门区不摆家具</text><text x="256" y="130" font-size="18" fill="#233d36" text-anchor="middle">客厅北部通行区</text><rect x="260" y="260" width="355" height="115" rx="0" fill="#ead5b7" stroke="#233d36" /><rect x="615" y="260" width="267" height="115" rx="0" fill="#d8decf" stroke="#233d36" /><text x="438" y="303" font-size="17" fill="#233d36" text-anchor="middle">餐桌 1600（延伸1800）×800</text><text x="438" y="337" font-size="17" fill="#233d36" text-anchor="middle">高约750 / 普通餐椅</text><text x="749" y="301" font-size="18" fill="#233d36" text-anchor="middle">干岛台1200×800</text><text x="749" y="337" font-size="16" fill="#233d36" text-anchor="middle">高850–900 / 无水无火</text><line x1="615" y1="260" x2="615" y2="375" stroke="#ac6537" stroke-width="4" stroke-dasharray=""/><rect x="285" y="208" width="68" height="39" rx="6" fill="#fff" stroke="#ac936d" /><rect x="285" y="388" width="68" height="39" rx="6" fill="#fff" stroke="#ac936d" /><rect x="502" y="208" width="68" height="39" rx="6" fill="#fff" stroke="#ac936d" /><rect x="502" y="388" width="68" height="39" rx="6" fill="#fff" stroke="#ac936d" /><rect x="395" y="208" width="68" height="39" rx="6" fill="none" stroke="#ac6537" stroke-dasharray="5 4"/><rect x="395" y="388" width="68" height="39" rx="6" fill="none" stroke="#ac6537" stroke-dasharray="5 4"/><rect x="716" y="441" width="285" height="55" rx="0" fill="#ead5b7" stroke="#233d36" /><text x="858" y="474" font-size="17" fill="#233d36" text-anchor="middle">H03 咖啡餐边柜 · 靠东错位</text><text x="753" y="413" font-size="14" fill="#427f9a" text-anchor="middle">岛至柜前净距目标900–1000</text><text x="950" y="298" font-size="14" fill="#233d36" text-anchor="middle">岛东侧</text><text x="950" y="324" font-size="14" fill="#233d36" text-anchor="middle">900–1000</text><text x="151" y="288" font-size="14" fill="#233d36" text-anchor="middle">桌西侧主通道</text><text x="151" y="316" font-size="15" fill="#233d36" text-anchor="middle">1000–1100</text><text x="267" y="485" font-size="15" fill="#ac6537" text-anchor="middle">虚线椅为六人追加位置；端头不设椅</text><text x="576" y="535" font-size="15" fill="#ac6537" text-anchor="middle">非比例示意；岛桌常态总长2800 / 延伸3000，桌端需借客厅。连接高差、支承、门扇及座椅必须放样。</text></g></svg>