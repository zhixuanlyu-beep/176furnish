361" stroke-width="2" stroke-dasharray="5 3"/><text x="312.4" y="466.4" font-size="10" fill="#287361" text-anchor="middle">⑥</text><polyline points="52.800000000000004,272.8 79.2,272.8 79.2,446.776 425.74399999999997,446.776 425.74399999999997,233.2 506.0,233.2" fill="none" stroke="#b34539" stroke-width="2" stroke-dasharray="5 3"/><text x="506.0" y="233.2" font-size="10" fill="#b34539" text-anchor="middle">⑦</text><text x="858" y="120" font-size="15" fill="#233d36" text-anchor="middle">① 归家 → 西侧开放口 → 冰箱 / 食品</text><text x="858" y="161" font-size="15" fill="#233d36" text-anchor="middle">② 冰箱 → 水槽 → 净备菜800 → 灶</text><text x="858" y="202" font-size="15" fill="#233d36" text-anchor="middle">③ 水槽 → 岛台补充备餐（北侧单人）</text><text x="858" y="243" font-size="15" fill="#233d36" text-anchor="middle">④ 灶 → 岛台摆盘 → 餐桌东侧</text><text x="858" y="284" font-size="15" fill="#233d36" text-anchor="middle">⑤ 收餐 → 东侧900 → 水槽 / 洗碗</text><text x="858" y="325" font-size="15" fill="#233d36" text-anchor="middle">⑥ 客餐区 → 南墙咖啡；取水回上部</text><text x="858" y="366" font-size="15" fill="#233d36" text-anchor="middle">⑦ 入户 → 桌南横向绕行 → 阳台B</text><text x="858" y="407" font-size="15" fill="#ac6537" text-anchor="middle">冰箱离水槽更远：接受跨餐厨取菜。</text><text x="858" y="448" font-size="15" fill="#ac6537" text-anchor="middle">门全开、无人取物：桌南横向余642。</text><text x="858" y="489" font-size="15" fill="#ac6537" text-anchor="middle">南墙设备前站人时，该横向通路受阻。</text><text x="858" y="530" font-size="15" fill="#ac6537" text-anchor="middle">浅色带为600衣篮，无人取物状态；</text><text x="858" y="571" font-size="15" fill="#ac6537" text-anchor="middle">当前布局不具备该处同时操作与通行。</text><text x="575" y="715" font-size="15" fill="#233d36" text-anchor="middle">西侧路线限客餐过渡带；保留粗墙端部、公卫、C/D墙及客厅投影路线。</text></g></svg>