1.55,362.56 306.71,364.39 311.95,365.94 317.27,367.22 322.65,368.21 328.08,368.93 333.53,369.36 339.00,369.50 344.47,369.36 349.92,368.93 355.35,368.21 360.73,367.22 366.05,365.94 371.29,364.39 376.45,362.56 381.50,360.47 386.44,358.11 391.25,355.50 339.00,265.00" fill="#f6e9d6" fill-opacity=".65" stroke="#ac6537" stroke-dasharray="4 3"/><rect x="143.2" y="265.0" width="182.6" height="132.0" fill="none" stroke="#427f9a" stroke-dasharray="4 3"/><text x="236" y="337" font-size="13" fill="#427f9a" text-anchor="middle">抽屉拉出600算例</text><rect x="152.0" y="397.0" width="165.0" height="132.0" fill="#eef1e7" stroke="#287361" stroke-dasharray="4 3"/><text x="234" y="466" font-size="14" fill="#287361" text-anchor="middle">站位600</text><text x="427" y="344" font-size="14" fill="#ac6537" text-anchor="middle">门120°算例</text><text x="422" y="375" font-size="13" fill="#ac6537" text-anchor="middle">侧向超出约238</text><text x="422" y="404" font-size="13" fill="#ac6537" text-anchor="middle">左右分别另留</text><text x="285" y="575" font-size="14" fill="#233d36" text-anchor="middle">全开角、抽屉、背部散热和把手均按型号替换。</text><text x="285" y="602" font-size="14" fill="#ac6537" text-anchor="middle">柜位900–1000起排；1300前场不含独立通行。</text><text x="857" y="65" font-size="18" fill="#233d36" text-anchor="middle">水槽—备菜—灶连续；洗碗在备菜下</text><rect x="620" y="110" width="110" height="100" fill="#d8decf" stroke="#233d36" stroke-dasharray=""/><text x="675" y="154" font-size="17" fill="#233d36" text-anchor="middle">水槽</text><rect x="730" y="110" width="140" height="100" fill="#d8decf" stroke="#233d36" stroke-dasharray=""/><text x="800" y="140" font-size="15" fill="#233d36" text-anchor="middle">备菜净面750</text><rect x="736" y="162" width="105" height="47" fill="#ead5b7" stroke="#233d36" stroke-dasharray=""/><text x="789" y="191" font-size="14" fill="#233d36" text-anchor="middle">洗碗600</text><rect x="870" y="110" width="220" height="100" fill="#d8decf" stroke="#233d36" stroke-dasharray=""/><text x="980" y="155" font-size="15" fill="#233d36" text-anchor="middle">灶 / 安全余量另核</text><rect x="736" y="210" width="105" height="114" fill="#f6e9d6" stroke="#ac6537" stroke-dasharray="5 4"/><text x="789" y="264" font-size="14" fill="#ac6537" text-anchor="middle">门投影P</text><text x="789" y="290" font-size="13" fill="#ac6537" text-anchor="middle">650算例</text><rect x="736" y="324" width="105" height="105" fill="#eef1e7" stroke="#287361" stroke-dasharray="4 3"/><text x="789" y="364" font-size="14" fill="#287361" text-anchor="middle">站位S</text><text x="789" y="392" font-size="13" fill="#287361" text-anchor="middle">600算例</text><rect x="620" y="444" width="470" height="4" fill="#427f9a" stroke="#427f9a" stroke-dasharray=""/><text x="890" y="476" font-size="14" fill="#b34539" text-anchor="middle">关闭线距台前1334算例，P＋S后仅余84</text><text x="957" y="345" font-size="14" fill="#233d36" text-anchor="middle">侧方进出</text><text x="957" y="372" font-size="14" fill="#233d36" text-anchor="middle">独立净宽待测</text><text x="857" y="519" font-size="15" fill="#b34539" text-anchor="middle">P＋S＝1250；若身后再通行900，共需2150。</text><text x="857" y="556" font-size="14" fill="#233d36" text-anchor="middle">分隔自公卫南墙附近起排，图示向南调200。</text><text x="857" y="588" font-size="14" fill="#233d36" text-anchor="middle">全开/全闭均核收门、装卸、燃气及家政门洞。</text><text x="575" y="634" font-size="15" fill="#ac6537" text-anchor="middle">满开算例不是候选机型实测；冰箱操作前场禁止咖啡柜和餐椅。全部设备尚未选型。</text></g></svg>