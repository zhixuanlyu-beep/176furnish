<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 570" role="img" aria-label="冰箱洗碗机开门装卸与投影幕通行概念"><g font-family="Microsoft YaHei, sans-serif"><text x="285" y="28" font-size="22" fill="#233d36" text-anchor="middle">冰箱：移出厨房，门朝公共区</text><rect x="380" y="80" width="115" height="190" rx="0" fill="#ccd9cc" stroke="#233d36" /><text x="437" y="146" font-size="16" fill="#233d36" text-anchor="middle">独立冰箱柜</text><text x="437" y="184" font-size="14" fill="#233d36" text-anchor="middle">两侧余量</text><text x="437" y="213" font-size="14" fill="#233d36" text-anchor="middle">按机型</text><rect x="267" y="80" width="113" height="190" rx="0" fill="#f6e9d6" stroke="#ac6537" stroke-dasharray="6 4"/><text x="324" y="144" font-size="16" fill="#ac6537" text-anchor="middle">门全开</text><text x="324" y="174" font-size="16" fill="#ac6537" text-anchor="middle">及抽屉</text><rect x="172" y="80" width="95" height="190" rx="0" fill="#eef1e7" stroke="#287361" stroke-dasharray="5 4"/><text x="219" y="153" font-size="16" fill="#233d36" text-anchor="middle">站人</text><text x="219" y="185" font-size="16" fill="#233d36" text-anchor="middle">取物</text><text x="83" y="151" font-size="15" fill="#233d36" text-anchor="middle">主通行</text><text x="83" y="181" font-size="15" fill="#233d36" text-anchor="middle">另留</text><line x1="100" y1="240" x2="100" y2="95" stroke="#287361" stroke-width="3" stroke-dasharray=""/><text x="286" y="310" font-size="16" fill="#ac6537" text-anchor="middle">门体投影 ＋ 装卸站位 ≠ 同时通行空间</text><text x="286" y="342" font-size="15" fill="#233d36" text-anchor="middle">柜前1200–1400仅起研；门铰和抽屉按实机</text><text x="286" y="373" font-size="15" fill="#233d36" text-anchor="middle">不堵公卫/入户，不侵厨房门及收门包络</text><line x1="555" y1="60" x2="555" y2="408" stroke="#bdc9bc" stroke-width="2" stroke-dasharray=""/><text x="853" y="28" font-size="21" fill="#233d36" text-anchor="middle">洗碗机：水槽旁直线柜，避开L转角</text><rect x="600" y="80" width="478" height="82" rx="0" fill="#d8decf" stroke="#82958c" /><text x="668" y="128" font-size="18" fill="#233d36" text-anchor="middle">水槽</text><rect x="741" y="82" width="148" height="78" rx="0" fill="#ead5b7" stroke="#233d36" /><text x="815" y="127" font-size="17" fill="#233d36" text-anchor="middle">600级洗碗机</text><text x="985" y="127" font-size="16" fill="#233d36" text-anchor="middle">转角缓冲</text><rect x="1010" y="163" width="68" height="84" rx="0" fill="#d8decf" stroke="#82958c" /><rect x="741" y="163" width="148" height="108" rx="0" fill="#f6e9d6" stroke="#ac6537" stroke-dasharray="6 4"/><text x="815" y="210" font-size="15" fill="#ac6537" text-anchor="middle">门板全开投影</text><text x="815" y="240" font-size="14" fill="#ac6537" text-anchor="middle">P：按型号</text><rect x="741" y="274" width="148" height="67" rx="0" fill="#eef1e7" stroke="#287361" stroke-dasharray="5 4"/><text x="815" y="301" font-size="14" fill="#233d36" text-anchor="middle">S：站人/弯腰取篮</text><text x="815" y="324" font-size="13" fill="#233d36" text-anchor="middle">示例550–600</text><text x="958" y="312" font-size="14" fill="#233d36" text-anchor="middle">侧方通行</text><text x="959" y="337" font-size="14" fill="#233d36" text-anchor="middle">另测净宽</text><text x="852" y="374" font-size="15" fill="#ac6537" text-anchor="middle">如要求身后同时通行，还需另加T，不能重复计入S</text><line x1="40" y1="411" x2="1110" y2="411" stroke="#bdc9bc" stroke-width="2" stroke-dasharray=""/><text x="580" y="441" font-size="19" fill="#233d36" text-anchor="middle">投影：西墙沙发 → 东侧收纳幕 → 幕后通往D的路线</text><text x="580" y="477" font-size="16" fill="#233d36" text-anchor="middle">100–110英寸16:9画面宽约2214–2435；镜头投距 ÷ 画宽 ＝ 需要的投射比</text><text x="580" y="510" font-size="16" fill="#233d36" text-anchor="middle">幕放下仍保900–1000通行目标；尺寸另加幕盒/黑边，吊点与信号线可检修</text><text x="580" y="548" font-size="15" fill="#ac6537" text-anchor="middle">全部为非比例功能示意；净距、门开角、转角柜门、幕平面与承重基层均须现场核验。</text></g></svg>