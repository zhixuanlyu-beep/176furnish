537" stroke-width="1" stroke-dasharray="3 2"/><polyline points="206.75,542.3199999999999 162.875,542.3199999999999 163.04195762122467,538.4960417869465 163.54155983658936,534.7011862048635 164.37000437156712,530.9643143961268 165.52098626301827,527.3138662115863 166.98574584376698,523.7776237661268 168.75313540895775,520.3824999999999 170.80970405682046,517.1543338550979 173.13980005815483,514.1176936250031 175.72568997544022,511.2956899754402 178.5476936250031,508.7098000581549 181.58433385509784,506.37970405682046 184.8125,504.32313540895774 188.2076237661268,502.555745843767 191.7438662115863,501.0909862630183 195.3943143961269,499.9400043715671 199.1311862048634,499.1115598365893 202.92604178694648,498.61195762122463 206.75,498.445 206.75,542.3199999999999" fill="none" stroke="#ac6537" stroke-width="1" stroke-dasharray="3 2"/><text x="860" y="100" font-size="20" fill="#233d36" text-anchor="middle">同一位置叠加不同使用状态</text><text x="850" y="150" font-size="14" fill="#233d36" text-anchor="middle">冰箱门朝北：双门90°齐平铰链算例。</text><text x="850" y="188" font-size="14" fill="#233d36" text-anchor="middle">必须选可在该角度全抽的机型；否则改柜模块。</text><text x="850" y="226" font-size="14" fill="#233d36" text-anchor="middle">门弧487.5；抽屉600；前方人位600。</text><text x="850" y="264" font-size="14" fill="#ac6537" text-anchor="middle">六人桌尾至冰箱面1242，扣1200只余42。</text><text x="850" y="302" font-size="14" fill="#233d36" text-anchor="middle">42不是通道；冰箱由西侧开放口到达。</text><text x="850" y="340" font-size="14" fill="#233d36" text-anchor="middle">下烤箱、上蒸箱分别开门550，共用投影。</text><text x="850" y="378" font-size="14" fill="#233d36" text-anchor="middle">取热盘人位600；两台均可单独检修。</text><text x="850" y="416" font-size="14" fill="#233d36" text-anchor="middle">咖啡抽屉500＋人位600；取水箱不得顶吊柜。</text><text x="850" y="454" font-size="14" fill="#233d36" text-anchor="middle">洗碗门650＋装卸600，岛在其西侧。</text><text x="850" y="492" font-size="14" fill="#ac6537" text-anchor="middle">东侧绕行776；600宽衣篮两侧合计余176。</text><text x="850" y="530" font-size="14" fill="#ac6537" text-anchor="middle">该段不足900舒适目标，装卸时应单人通过。</text><text x="850" y="568" font-size="14" fill="#233d36" text-anchor="middle">满开状态无柜椅相交；不代表多人同时操作。</text><text x="850" y="606" font-size="14" fill="#ac6537" text-anchor="middle">设备包络按厂家安装图替换后重算。</text><text x="575" y="731" font-size="15" fill="#ac6537" text-anchor="middle">墙面原点、阳台B门洞900及设备尺寸均为算例；净宽、门扇与携篮转弯须现场放样。</text></g></svg>