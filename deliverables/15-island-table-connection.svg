 x="295" y="85" font-size="15" fill="#233d36" text-anchor="middle">4人：棕色独立桌脚 / 绿色膝部候选</text><svg x="600" y="110" width="490" height="200" viewBox="1000 50 3100 1150"><g data-model="a398ea4fa54fd755995154d0015040b848deebf1966e73c0f9668fc84c76d69b" transform="translate(0 0) scale(1)"><g stroke-width="14"><g data-object="island" data-box="2900,225,1000,750"><rect x="2900" y="225" width="1000" height="750" fill="#d8decf" stroke="#233d36" stroke-dasharray=""/></g><g data-object="table" data-box="1100,200,1800,800"><rect x="1100" y="200" width="1800" height="800" fill="none" stroke="#233d36" stroke-dasharray=""/></g><g data-object="leg-6-0" data-box="1115,530,70,140"><rect x="1115" y="530" width="70" height="140" fill="#ac6537" stroke="#233d36" stroke-dasharray=""/></g><g data-object="leg-6-1" data-box="2815,530,70,140"><rect x="2815" y="530" width="70" height="140" fill="#ac6537" stroke="#233d36" stroke-dasharray=""/></g><g data-object="knee-6-0" data-box="1150.0,200,500,300"><rect x="1150.0" y="200" width="500" height="300" fill="none" stroke="#287361" stroke-dasharray="30 30"/></g><g data-object="knee-6-1" data-box="1150.0,700,500,300"><rect x="1150.0" y="700" width="500" height="300" fill="none" stroke="#287361" stroke-dasharray="30 30"/></g><g data-object="knee-6-2" data-box="1750.0,200,500,300"><rect x="1750.0" y="200" width="500" height="300" fill="none" stroke="#287361" stroke-dasharray="30 30"/></g><g data-object="knee-6-3" data-box="1750.0,700,500,300"><rect x="1750.0" y="700" width="500" height="300" fill="none" stroke="#287361" stroke-dasharray="30 30"/></g><g data-object="knee-6-4" data-box="2350.0,200,500,300"><rect x="2350.0" y="200" width="500" height="300" fill="none" stroke="#287361" stroke-dasharray="30 30"/></g><g data-object="knee-6-5" data-box="2350.0,700,500,300"><rect x="2350.0" y="700" width="500" height="300" fill="none" stroke="#287361" stroke-dasharray="30 30"/></g><g data-object="rail" data-box="1200,540,1600,120"><rect x="1200" y="540" width="1600" height="120" fill="none" stroke="#427f9a" stroke-dasharray="70 40"/></g></g></g></svg><text x="845" y="85" font-size="15" fill="#233d36" text-anchor="middle">6人：棕色独立桌脚 / 绿色膝部候选</text><polyline points="100,555 1040,555" fill="none" stroke="#233d36" stroke-width="3" stroke-dasharray=""/><rect x="150" y="420" width="490" height="20" fill="#d8decf" stroke="#233d36" stroke-dasharray=""/><rect x="640" y="370" width="280" height="185" fill="#d8decf" stroke="#233d36" stroke-dasharray=""/><rect x="175" y="440" width="18" height="115" fill="#ac6537" stroke="#233d36" stroke-dasharray=""/><rect x="605" y="440" width="18" height="115" fill="#ac6537" stroke="#233d36" stroke-dasharray=""/><rect x="195" y="445" width="395" height="14" fill="none" stroke="#427f9a" stroke-dasharray="6 4"/><text x="390" y="400" font-size="15" fill="#233d36" text-anchor="middle">桌高约750；轨道置膝部上方，净高待厂家</text><text x="790" y="355" font-size="16" fill="#233d36" text-anchor="middle">岛高850–900</text><polyline points="150,470 100,470" fill="none" stroke="#427f9a" stroke-width="3" stroke-dasharray=""/><text x="205" y="500" font-size="14" fill="#427f9a" text-anchor="middle">← 西伸200</text><rect x="940" y="365" width="12" height="190" fill="#bec9be" stroke="#233d36" stroke-dasharray=""/><polyline points="920,387 940,387" fill="none" stroke="#ac6537" stroke-width="4" stroke-dasharray=""/><text x="990" y="340" font-size="14" fill="#ac6537" text-anchor="middle">76可拆收口</text><text x="575" y="615" font-size="14" fill="#233d36" text-anchor="middle">桌脚70×140、膝部500×300为平面候选包络，四／六人分别校验；桌脚随西端伸展。</text><text x="575" y="646" font-size="14" fill="#ac6537" text-anchor="middle">轨道平面120宽，须核桌下净高、横梁和人体大腿；不得将固定岛台当未经核算的悬挑支点。</text><text x="575" y="677" font-size="14" fill="#ac6537" text-anchor="middle">连接只作定位/防缝意图：独立支承承重，抗倾覆、紧固件、伸缩锁止及承载由厂家核算。</text><text x="575" y="708" font-size="14" fill="#233d36" text-anchor="middle">岛东76mm采用可拆收口；可清洁、不封死管线，北侧柜门留水槽阀门及存水弯检修。</text><text x="575" y="739" font-size="14" fill="#ac6537" text-anchor="middle">绿色膝部与桌腿平面未相交≠三维舒适；维护开启与人位不得借用携篮通道，使用须错时。</text><text x="575" y="770" font-size="14" fill="#233d36" text-anchor="middle">岛坐标(2900,225)固定；四人桌(1300,200)，六人桌(1100,200)，均800深。</text></g></svg>