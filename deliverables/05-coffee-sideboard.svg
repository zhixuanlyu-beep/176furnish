<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" role="img" aria-label="H03水箱式咖啡餐边柜概念立面"><g font-family="Microsoft YaHei, sans-serif"><text x="425" y="30" font-size="23" fill="#233d36" text-anchor="middle">H03 咖啡餐边柜 · 水箱式 / 仅接电</text><rect x="80" y="220" width="690" height="170" rx="0" fill="#e4e9db" stroke="#82958c" /><line x1="80" y1="215" x2="770" y2="215" stroke="#233d36" stroke-width="6" stroke-dasharray=""/><line x1="310" y1="222" x2="310" y2="389" stroke="#82958c" stroke-width="2" stroke-dasharray=""/><line x1="540" y1="222" x2="540" y2="389" stroke="#82958c" stroke-width="2" stroke-dasharray=""/><text x="195" y="285" font-size="18" fill="#233d36" text-anchor="middle">咖啡耗材抽屉</text><text x="425" y="285" font-size="18" fill="#233d36" text-anchor="middle">杯具封闭收纳</text><text x="655" y="285" font-size="18" fill="#233d36" text-anchor="middle">餐具／备用用品</text><rect x="126" y="118" width="148" height="94" rx="5" fill="#f0e4cd" stroke="#233d36" /><text x="200" y="155" font-size="19" fill="#233d36" text-anchor="middle">咖啡机</text><text x="200" y="186" font-size="15" fill="#233d36" text-anchor="middle">水箱可取</text><rect x="337" y="144" width="79" height="68" rx="5" fill="#f0e4cd" stroke="#233d36" /><text x="376" y="179" font-size="16" fill="#233d36" text-anchor="middle">磨豆</text><rect x="520" y="202" width="175" height="10" rx="0" fill="#f0e4cd" stroke="#82958c" /><text x="607" y="180" font-size="17" fill="#233d36" text-anchor="middle">留操作与接水托盘</text><line x1="200" y1="110" x2="200" y2="67" stroke="#ac6537" stroke-width="2" stroke-dasharray="5 4"/><text x="425" y="70" font-size="16" fill="#ac6537" text-anchor="middle">上方不做压低吊柜；开盖、取水箱及加豆空间按型号</text><rect x="653" y="109" width="50" height="22" rx="5" fill="#427f9a" stroke="#427f9a" /><text x="678" y="125" font-size="13" fill="#fff" text-anchor="middle">电源</text><text x="656" y="151" font-size="14" fill="#427f9a" text-anchor="middle">避开加水操作区</text><line x1="80" y1="418" x2="770" y2="418" stroke="#233d36" stroke-width="2" stroke-dasharray=""/><text x="425" y="446" font-size="18" fill="#233d36" text-anchor="middle">宽1200–1400 / 深550–600 / 高850–900 mm，均为研究起点</text><text x="425" y="357" font-size="16" fill="#ac6537" text-anchor="middle">不设水槽、给水口、排水口；废水盘取出后到中厨处理</text></g></svg>