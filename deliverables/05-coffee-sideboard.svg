/></g></g></g></svg><text x="850" y="640" font-size="17" fill="#233d36" text-anchor="middle">咖啡台／台式微波炉侧视 · 北向前方 →</text><text x="40" y="670" font-size="15" fill="#233d36" text-anchor="start">棕虚线为开启包络，绿虚线为人员操作；侧视不混合不同柜体。</text><text x="40" y="697" font-size="15" fill="#233d36" text-anchor="start">微波炉上方绿线：概念散热；台面前棕线：开门；前方绿线：取放热食。</text><text x="40" y="724" font-size="15" fill="#233d36" text-anchor="start">咖啡台面实际顶930mm；手动取水箱与废水盘；台式微波炉不封入柜格，净距按厂家。</text><text x="40" y="751" font-size="15" fill="#233d36" text-anchor="start">独立蒸箱和烤箱的开门、取箱、取盘与电源分别核验；实际设备高度及安装条件待选型。</text></g></svg>