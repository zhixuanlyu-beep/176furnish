<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 650" role="img" aria-label="R10 两台蒸烤开门与咖啡取水箱 · 高度及前伸算例"><title>R10 两台蒸烤开门与咖啡取水箱 · 高度及前伸算例</title><g font-family="Microsoft YaHei, sans-serif"><text x="575.0" y="30" font-size="22" fill="#233d36" text-anchor="middle">R10 两台蒸烤开门与咖啡取水箱 · 高度及前伸算例</text><rect x="90" y="70" width="120" height="440" rx="0" fill="#e2e7da" stroke="#82958c" /><line x1="60" y1="510" x2="535" y2="510" stroke="#233d36" stroke-width="2" stroke-dasharray=""/><text x="140" y="550" font-size="16" fill="#233d36" text-anchor="middle">600深高柜</text><rect x="115" y="308.0" width="95" height="72" rx="0" fill="#fff" stroke="#82958c" /><line x1="210" y1="380.0" x2="320" y2="380.0" stroke="#ac6537" stroke-width="4" stroke-dasharray=""/><line x1="320" y1="380.0" x2="350" y2="380.0" stroke="#ac6537" stroke-width="2" stroke-dasharray="5 3"/><text x="390" y="365.0" font-size="15" fill="#233d36" text-anchor="middle">下烤：取热盘约650</text><text x="384" y="400.0" font-size="13" fill="#ac6537" text-anchor="middle">门向前550；人位另600</text><rect x="115" y="208.0" width="95" height="72" rx="0" fill="#fff" stroke="#82958c" /><line x1="210" y1="280.0" x2="320" y2="280.0" stroke="#ac6537" stroke-width="4" stroke-dasharray=""/><line x1="320" y1="280.0" x2="350" y2="280.0" stroke="#ac6537" stroke-width="2" stroke-dasharray="5 3"/><text x="390" y="265.0" font-size="15" fill="#233d36" text-anchor="middle">上蒸：取热盘约1150</text><text x="384" y="300.0" font-size="13" fill="#ac6537" text-anchor="middle">门向前550；人位另600</text><line x1="210" y1="240" x2="290" y2="240" stroke="#427f9a" stroke-width="2" stroke-dasharray="5 3"/><text x="365" y="221" font-size="14" fill="#427f9a" text-anchor="middle">蒸箱水箱取出约1350高</text><text x="310" y="83" font-size="15" fill="#233d36" text-anchor="middle">两台门分别展开，取盘高度按使用者调整</text><text x="290" y="593" font-size="14" fill="#233d36" text-anchor="middle">烤箱/蒸箱独立电源、层间散热及独立前抽检修。</text><rect x="650" y="330" width="400" height="180" rx="0" fill="#e2e7da" stroke="#82958c" /><text x="850" y="555" font-size="16" fill="#233d36" text-anchor="middle">咖啡1300×600 / 高850–900</text><rect x="695" y="215" width="140" height="110" rx="0" fill="#f0e4cd" stroke="#82958c" /><text x="765" y="265" font-size="17" fill="#233d36" text-anchor="middle">水箱机</text><rect x="890" y="260" width="70" height="65" rx="0" fill="#f0e4cd" stroke="#82958c" /><text x="925" y="292" font-size="15" fill="#233d36" text-anchor="middle">磨豆</text><line x1="765" y1="205" x2="765" y2="110" stroke="#427f9a" stroke-width="2" stroke-dasharray="5 3"/><text x="850" y="87" font-size="16" fill="#427f9a" text-anchor="middle">上方留取箱、开盖及排汽空间</text><line x1="835" y1="310" x2="1020" y2="310" stroke="#ac6537" stroke-width="2" stroke-dasharray="5 3"/><text x="930" y="202" font-size="15" fill="#ac6537" text-anchor="middle">废水盘前抽</text><text x="850" y="593" font-size="14" fill="#233d36" text-anchor="middle">咖啡仅接电；加水洗杯可用岛槽或原主水槽。</text></g></svg>