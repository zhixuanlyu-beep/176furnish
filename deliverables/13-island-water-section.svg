 data-object="chair_pull_3" data-box="2250.0,1000,500,800"><rect x="2250.0" y="1000" width="500" height="800" fill="none" stroke="#ac6537" stroke-dasharray="45 45"/></g><g data-object="chair_seated_0" data-box="1450.0,-250,500,450"><rect x="1450.0" y="-250" width="500" height="450" fill="#fff" stroke="#ac6537" stroke-dasharray=""/></g><g data-object="chair_seated_1" data-box="2250.0,-250,500,450"><rect x="2250.0" y="-250" width="500" height="450" fill="#fff" stroke="#ac6537" stroke-dasharray=""/></g><g data-object="chair_seated_2" data-box="1450.0,1000,500,450"><rect x="1450.0" y="1000" width="500" height="450" fill="#fff" stroke="#ac6537" stroke-dasharray=""/></g><g data-object="chair_seated_3" data-box="2250.0,1000,500,450"><rect x="2250.0" y="1000" width="500" height="450" fill="#fff" stroke="#ac6537" stroke-dasharray=""/></g><text x="3588.0" y="-2359.0" font-size="190" fill="#233d36" text-anchor="middle">主水槽</text><text x="2800.0" y="-2359.0" font-size="190" fill="#233d36" text-anchor="middle">备菜800</text><text x="2060.0" y="-2359.0" font-size="190" fill="#233d36" text-anchor="middle">灶</text><text x="3400.0" y="665.0" font-size="190" fill="#233d36" text-anchor="middle">带水岛</text><text x="587.5" y="2688.0" font-size="190" fill="#233d36" text-anchor="middle">冰箱</text><text x="1375.0" y="2763.0" font-size="190" fill="#233d36" text-anchor="middle">蒸／烤</text><text x="2325.0" y="2763.0" font-size="190" fill="#233d36" text-anchor="middle">咖啡1300</text><text x="3425.5" y="2763.0" font-size="190" fill="#233d36" text-anchor="middle">食品</text><text x="2100.0" y="665.0" font-size="190" fill="#233d36" text-anchor="middle">1600×800</text></g></g></svg><g data-model="e076298a32307d32d8c153a516c94fb05d81f4c542994ed85874554e8a292c61" transform="translate(120 330) scale(0.07)"><g data-route="C02-drain"><polyline points="3630,510 3876,510 3876,-2400 3580,-2400" fill="none" stroke="#427f9a" stroke-width="30" stroke-dasharray="60 45"/></g><g data-route="C02-cold"><polyline points="3600,-2480 3806,-2480 3806,440 3630,440" fill="none" stroke="#287361" stroke-width="30" stroke-dasharray=""/></g><g data-route="C02-hot"><polyline points="3550,-2540 3756,-2540 3756,380 3630,380" fill="none" stroke="#b34539" stroke-width="30" stroke-dasharray=""/></g><text x="3420" y="-2900" font-size="160" fill="#427f9a" text-anchor="middle">W0 原厨房合法污水支管？</text></g><text x="810" y="90" font-size="18" fill="#233d36" text-anchor="middle">柜内：双独立阀＋存水弯＋检修＋探漏</text><rect x="600" y="160" width="180" height="180" fill="#e5e9dd" stroke="#233d36" stroke-dasharray=""/><rect x="620" y="150" width="120" height="25" fill="#c8e2eb" stroke="#233d36" stroke-dasharray=""/><text x="690" y="205" font-size="15" fill="#233d36" text-anchor="middle">辅助水槽</text><polyline points="680,178 680,230 710,230 710,260 740,260 740,290" fill="none" stroke="#427f9a" stroke-width="4" stroke-dasharray=""/><text x="885" y="232" font-size="14" fill="#233d36" text-anchor="middle">可达存水弯 / 清扫检修</text><text x="885" y="265" font-size="14" fill="#233d36" text-anchor="middle">冷热阀独立，底板漏水探测</text><polyline points="580,340 1080,340" fill="none" stroke="#233d36" stroke-width="3" stroke-dasharray=""/><text x="1000" y="328" font-size="13" fill="#233d36" text-anchor="middle">完成面±0 连续平地</text><polyline points="580,480 1080,480" fill="none" stroke="#233d36" stroke-width="6" stroke-dasharray=""/><text x="840" y="507" font-size="14" fill="#ac6537" text-anchor="middle">结构楼板：不预设开槽、钻梁或凿飘窗台</text><polyline points="740,290 740,365 1040,435" fill="none" stroke="#427f9a" stroke-width="4" stroke-dasharray=""/><text x="865" y="385" font-size="14" fill="#427f9a" text-anchor="middle">排水流向原厨房 →</text><polyline points="1040,435 1080,435 1080,540 1050,540" fill="none" stroke="#777" stroke-width="1" stroke-dasharray=""/><text x="950" y="548" font-size="15" fill="#427f9a" text-anchor="middle">W0 接入管内底标高 z0＝待测</text><text x="815" y="580" font-size="14" fill="#233d36" text-anchor="middle">可用地面构造 H＝待测；保温/保护层另核</text><text x="575" y="622" font-size="15" fill="#233d36" text-anchor="middle">平面排水：246＋2910＋296＝3452mm；从C东侧向北，接原厨房合法生活污水支管。</text><text x="575" y="652" font-size="15" fill="#233d36" text-anchor="middle">坡度研究1% / 2% / 2.5% → 落差34.52 / 69.04 / 86.30mm；最终坡度由给排水专业确定。</text><text x="575" y="682" font-size="15" fill="#233d36" text-anchor="middle">按外径50＋保护余量20初筛：H至少104.52 / 139.04 / 156.30mm，尚未计接头局部增高。</text><text x="575" y="712" font-size="14" fill="#233d36" text-anchor="middle">条件：岛端管内底 z岛 ≥ z0＋iL；全路径管外顶及接头须落在可用构造内，接入需防返味。</text><text x="575" y="746" font-size="16" fill="#b34539" text-anchor="middle">重力排水未成立：缺z0、H及沿线障碍实测；继续协调带水需求，不默认地台或提升泵。</text><text x="575" y="780" font-size="14" fill="#233d36" text-anchor="middle">绿实线冷水 / 红实线热水 / 蓝虚线污水；平面路线与剖面引线分别标识，长度非施工下料。</text></g></svg>