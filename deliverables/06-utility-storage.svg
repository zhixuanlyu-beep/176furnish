<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 510" role="img" aria-label="R8家庭厅大件柜与两处机器人候选"><g font-family="Microsoft YaHei, sans-serif"><text x="250" y="28" font-size="21" fill="#233d36" text-anchor="middle">家庭厅：大件柜＋浅书柜＋办公</text><rect x="35" y="65" width="430" height="320" rx="0" fill="#e0eee7" stroke="#82958c" /><rect x="50" y="82" width="72" height="207" rx="0" fill="#d8decf" stroke="#82958c" /><text x="86" y="320" font-size="14" fill="#233d36" text-anchor="middle">深600–650</text><rect x="155" y="83" width="220" height="68" rx="0" fill="#d8decf" stroke="#82958c" /><text x="265" y="125" font-size="16" fill="#233d36" text-anchor="middle">1600–1800办公桌</text><rect x="214" y="170" width="75" height="50" rx="0" fill="#fff" stroke="#82958c" /><rect x="155" y="333" width="205" height="36" rx="0" fill="#d8decf" stroke="#82958c" /><text x="260" y="357" font-size="14" fill="#233d36" text-anchor="middle">浅书柜300–350</text><line x1="415" y1="340" x2="415" y2="115" stroke="#287361" stroke-width="3" stroke-dasharray="6 4"/><text x="407" y="93" font-size="14" fill="#233d36" text-anchor="middle">A/B</text><text x="252" y="265" font-size="15" fill="#ac6537" text-anchor="middle">柜门/拉椅后通行待测</text><text x="250" y="419" font-size="15" fill="#233d36" text-anchor="middle">鞋柜在入户门内北侧：1000–1200×350</text><text x="250" y="453" font-size="14" fill="#233d36" text-anchor="middle">取消客厅独立储藏室，保留西墙沙发与D路线</text><text x="700" y="28" font-size="21" fill="#233d36" text-anchor="middle">L02 阳台B · 首选</text><rect x="568" y="65" width="240" height="320" rx="0" fill="#e9ece6" stroke="#82958c" /><rect x="625" y="83" width="161" height="111" rx="0" fill="#d8decf" stroke="#82958c" /><text x="705" y="126" font-size="17" fill="#233d36" text-anchor="middle">洗烘叠放</text><text x="705" y="159" font-size="14" fill="#233d36" text-anchor="middle">阀门可达</text><rect x="645" y="296" width="141" height="60" rx="0" fill="#ead5b7" stroke="#82958c" /><text x="715" y="331" font-size="16" fill="#233d36" text-anchor="middle">机器人基站</text><text x="690" y="241" font-size="15" fill="#233d36" text-anchor="middle">浅挂清洁工具</text><text x="688" y="419" font-size="14" fill="#233d36" text-anchor="middle">原图3.2㎡不代表安装通过</text><text x="688" y="453" font-size="14" fill="#ac6537" text-anchor="middle">分隔关闭后的家政路待核</text><text x="984" y="28" font-size="21" fill="#233d36" text-anchor="middle">R01 原公卫 · 备选</text><rect x="858" y="65" width="250" height="320" rx="0" fill="#e5eff0" stroke="#82958c" /><rect x="875" y="83" width="214" height="85" rx="0" fill="#d8decf" stroke="#82958c" /><text x="982" y="118" font-size="16" fill="#233d36" text-anchor="middle">台盆柜侧/下干区</text><text x="982" y="146" font-size="14" fill="#233d36" text-anchor="middle">按基站型号排</text><line x1="875" y1="230" x2="1090" y2="230" stroke="#427f9a" stroke-width="2" stroke-dasharray="5 4"/><text x="982" y="270" font-size="16" fill="#233d36" text-anchor="middle">马桶 / 淋浴不挤占</text><text x="982" y="305" font-size="15" fill="#233d36" text-anchor="middle">保防水与挡水</text><text x="984" y="419" font-size="14" fill="#233d36" text-anchor="middle">原图3.7㎡，干区净空未测</text><text x="984" y="453" font-size="14" fill="#ac6537" text-anchor="middle">清扫须开公卫门并避溅水</text><text x="575" y="495" font-size="15" fill="#ac6537" text-anchor="middle">两处基站二选一，均核合法供水/污水、湿区电气、门槛、维护前场和设备搬出。</text></g></svg>