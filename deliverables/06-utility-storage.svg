<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 540" role="img" aria-label="原餐厅分出独立储藏室及阳台B洗烘家政间概念"><g font-family="Microsoft YaHei, sans-serif"><text x="300" y="30" font-size="22" fill="#233d36" text-anchor="middle">原餐厅：书房＋独立储藏＋通道</text><rect x="35" y="65" width="415" height="365" rx="0" fill="#e0eee7" stroke="#82958c" /><rect x="450" y="65" width="115" height="425" rx="0" fill="#faf8f1" stroke="#82958c" /><text x="506" y="245" font-size="16" fill="#233d36" text-anchor="middle">A / B通道</text><text x="506" y="274" font-size="13" fill="#233d36" text-anchor="middle">净宽目标</text><text x="506" y="298" font-size="14" fill="#233d36" text-anchor="middle">1000–1100</text><rect x="210" y="83" width="215" height="45" rx="0" fill="#d8decf" stroke="#82958c" /><text x="316" y="112" font-size="16" fill="#233d36" text-anchor="middle">1600–1800书桌</text><text x="362" y="222" font-size="18" fill="#233d36" text-anchor="middle">L形书房</text><text x="362" y="250" font-size="14" fill="#233d36" text-anchor="middle">约5–6㎡目标</text><line x1="450" y1="320" x2="450" y2="402" stroke="#427f9a" stroke-width="4" stroke-dasharray="5 4"/><text x="392" y="376" font-size="13" fill="#427f9a" text-anchor="middle">书房独立门</text><rect x="35" y="180" width="265" height="250" rx="0" fill="#ece6d9" stroke="#233d36" /><rect x="45" y="190" width="245" height="34" rx="0" fill="#d8decf" stroke="#82958c" /><rect x="45" y="224" width="38" height="155" rx="0" fill="#d8decf" stroke="#82958c" /><text x="186" y="272" font-size="20" fill="#233d36" text-anchor="middle">独立储藏室</text><text x="186" y="302" font-size="15" fill="#233d36" text-anchor="middle">约2.5–3㎡目标</text><text x="186" y="330" font-size="14" fill="#233d36" text-anchor="middle">层板深300–400</text><text x="167" y="356" font-size="13" fill="#233d36" text-anchor="middle">取物走道另核</text><line x1="93" y1="430" x2="192" y2="430" stroke="#fffef9" stroke-width="7" stroke-dasharray=""/><line x1="93" y1="430" x2="93" y2="366" stroke="#427f9a" stroke-width="2" stroke-dasharray=""/><path d="M93 366 Q162 366 192 430" fill="none" stroke="#427f9a" stroke-dasharray="4 4"/><text x="140" y="462" font-size="13" fill="#427f9a" text-anchor="middle">独立门700–800</text><rect x="219" y="350" width="81" height="80" rx="0" fill="#d9e6e2" stroke="#427f9a" /><text x="259" y="376" font-size="17" fill="#233d36" text-anchor="middle">R01</text><text x="259" y="400" font-size="13" fill="#233d36" text-anchor="middle">独立龛</text><line x1="227" y1="430" x2="293" y2="430" stroke="#427f9a" stroke-width="4" stroke-dasharray="4 3"/><line x1="260" y1="432" x2="260" y2="474" stroke="#287361" stroke-width="3" stroke-dasharray=""/><text x="312" y="496" font-size="16" fill="#233d36" text-anchor="middle">公共过渡区：储物门与基站分别开口</text><text x="302" y="525" font-size="14" fill="#ac6537" text-anchor="middle">门框＋墙垛＋基站开口需共同校总宽，图示非比例</text><line x1="610" y1="55" x2="610" y2="496" stroke="#bdc9bc" stroke-width="2" stroke-dasharray=""/><text x="872" y="30" font-size="22" fill="#233d36" text-anchor="middle">阳台B：洗烘家政间</text><rect x="715" y="65" width="235" height="365" rx="0" fill="#e9ece6" stroke="#233d36" /><rect x="750" y="95" width="165" height="126" rx="0" fill="#d8decf" stroke="#82958c" /><text x="832" y="128" font-size="17" fill="#233d36" text-anchor="middle">600级叠放</text><text x="832" y="159" font-size="16" fill="#233d36" text-anchor="middle">上：热泵烘干</text><text x="832" y="190" font-size="15" fill="#233d36" text-anchor="middle">下：自动投放洗衣</text><rect x="724" y="255" width="19" height="114" rx="0" fill="#d8decf" stroke="#82958c" /><text x="840" y="282" font-size="16" fill="#233d36" text-anchor="middle">前场与搬出路径</text><text x="840" y="310" font-size="16" fill="#233d36" text-anchor="middle">保持空闲</text><line x1="798" y1="400" x2="798" y2="340" stroke="#287361" stroke-width="3" stroke-dasharray=""/><line x1="770" y1="430" x2="885" y2="430" stroke="#427f9a" stroke-width="4" stroke-dasharray="4 3"/><text x="995" y="128" font-size="13" fill="#ac6537" text-anchor="middle">端部条件位</text><text x="997" y="156" font-size="13" fill="#ac6537" text-anchor="middle">核窗扇开启</text><text x="997" y="184" font-size="13" fill="#ac6537" text-anchor="middle">及设备检修</text><text x="832" y="461" font-size="16" fill="#233d36" text-anchor="middle">经中厨进入；机器人另设R01</text><text x="855" y="492" font-size="14" fill="#233d36" text-anchor="middle">清洁工具用100–150深浅挂板 / 折叠桶</text><text x="855" y="520" font-size="14" fill="#ac6537" text-anchor="middle">不布置两排深柜；门窗与水路尚未实测</text></g></svg>