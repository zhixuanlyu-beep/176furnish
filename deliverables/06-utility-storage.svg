<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 650" role="img" aria-label="R9 家庭厅：南侧入口清空，书籍上移至北侧桌上"><title>R9 家庭厅：南侧入口清空，书籍上移至北侧桌上</title><g font-family="Microsoft YaHei, sans-serif"><text x="575.0" y="28" font-size="22" fill="#233d36" text-anchor="middle">R9 家庭厅：南侧入口清空，书籍上移至北侧桌上</text><rect x="60.0" y="115.0" width="68.25" height="210.0" rx="0" fill="#d8decf" stroke="#287361" /><rect x="175.5" y="115.0" width="189.0" height="73.5" rx="0" fill="#d8decf" stroke="#287361" /><rect x="175.5" y="115.0" width="189.0" height="29.4" rx="0" fill="none" stroke="#287361" stroke-dasharray="4 3"/><rect x="238.5" y="209.5" width="63.0" height="84.0" rx="0" fill="#d8decf" stroke="#287361" /><rect x="128.25" y="115.0" width="63.0" height="210.0" rx="0" fill="none" stroke="#ac6537" stroke-dasharray="4 3"/><rect x="60.0" y="466.75" width="115.5" height="36.75" rx="0" fill="#d8decf" stroke="#287361" /><rect x="60.0" y="503.5" width="115.5" height="36.75" rx="0" fill="none" stroke="#ac6537" stroke-dasharray="4 3"/><polyline points="249.0,524.5 249.0,419.5 427.5,419.5 427.5,136.0" fill="none" stroke="#287361" stroke-width="2" stroke-dasharray="5 4"/><text x="94.65" y="346.0" font-size="13" fill="#233d36" text-anchor="middle">大件柜650深</text><text x="275.25" y="165.4" font-size="13" fill="#233d36" text-anchor="middle">桌1800×700</text><text x="270.0" y="99.25" font-size="13" fill="#233d36" text-anchor="middle">桌上书柜280深</text><text x="270.0" y="267.25" font-size="13" fill="#233d36" text-anchor="middle">拉出办公椅</text><text x="427.5" y="377.5" font-size="13" fill="#233d36" text-anchor="middle">通行1200</text><text x="249.0" y="414.25" font-size="13" fill="#233d36" text-anchor="middle">入口转弯区清空</text><text x="123.0" y="556.0" font-size="13" fill="#233d36" text-anchor="middle">鞋柜1100×350</text><rect x="365.5286129970902" y="119.0737148399612" width="81.47429679922405" height="20.368574199806012" rx="0" fill="#bad4df" stroke="#427f9a" /><text x="415" y="95" font-size="14" fill="#427f9a" text-anchor="middle">AC05</text><text x="790" y="105" font-size="20" fill="#233d36" text-anchor="middle">西侧深柜＋北侧桌上书柜</text><text x="800" y="158" font-size="15" fill="#ac6537" text-anchor="middle">房间算例4100×3300；原图净边界待测。</text><text x="800" y="200" font-size="15" fill="#233d36" text-anchor="middle">西柜650深、门展开600，办公椅600×800。</text><text x="800" y="242" font-size="15" fill="#233d36" text-anchor="middle">北桌1800×700，书柜约280深置桌上方。</text><text x="800" y="284" font-size="15" fill="#233d36" text-anchor="middle">东侧通行1200算例；南侧无落地书柜。</text><text x="800" y="326" font-size="15" fill="#233d36" text-anchor="middle">入户鞋柜1100×350；柜门展开350另画。</text><text x="800" y="368" font-size="15" fill="#ac6537" text-anchor="middle">入户门、鞋柜门与携行李转弯仍须放样。</text><text x="800" y="410" font-size="15" fill="#233d36" text-anchor="middle">AC05在书柜以外；出风朝通行侧，避办公椅。</text><text x="800" y="452" font-size="15" fill="#233d36" text-anchor="middle">洗烘留阳台B；L02 / R01基站二选一。</text><text x="800" y="494" font-size="15" fill="#ac6537" text-anchor="middle">阳台B核门窗、合法污水、拆机与防溅。</text><text x="575" y="620" font-size="15" fill="#ac6537" text-anchor="middle">虚线为柜门、拉椅或桌上书柜投影；不将开启占用重复算入通行净宽。</text></g></svg>