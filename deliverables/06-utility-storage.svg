<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 540" role="img" aria-label="西北角独立储藏推荐位与两处机器人候选位置"><g font-family="Microsoft YaHei, sans-serif"><text x="258" y="28" font-size="22" fill="#233d36" text-anchor="middle">推荐：客厅西北角独立储藏</text><rect x="45" y="70" width="220" height="265" rx="0" fill="#ece6d9" stroke="#233d36" /><rect x="55" y="80" width="40" height="242" rx="0" fill="#d8decf" stroke="#82958c" /><text x="180" y="147" font-size="18" fill="#233d36" text-anchor="middle">约2.5–3.2㎡</text><text x="180" y="183" font-size="16" fill="#233d36" text-anchor="middle">单侧浅架</text><text x="180" y="211" font-size="15" fill="#233d36" text-anchor="middle">取物道约900</text><line x1="265" y1="235" x2="265" y2="316" stroke="#fffef9" stroke-width="7" stroke-dasharray=""/><line x1="265" y1="235" x2="205" y2="235" stroke="#427f9a" stroke-width="2" stroke-dasharray=""/><path d="M205 235 Q205 290 265 316" fill="none" stroke="#427f9a" stroke-dasharray="4 4"/><text x="358" y="115" font-size="17" fill="#233d36" text-anchor="middle">入户转弯留空</text><text x="361" y="199" font-size="17" fill="#233d36" text-anchor="middle">门朝公共区</text><text x="350" y="235" font-size="15" fill="#233d36" text-anchor="middle">净宽700–800</text><text x="255" y="370" font-size="16" fill="#233d36" text-anchor="middle">净宽1400–1600 × 深1800–2000目标</text><text x="255" y="407" font-size="15" fill="#233d36" text-anchor="middle">占客厅，恢复完整书房；保西墙南段TV</text><text x="255" y="446" font-size="14" fill="#ac6537" text-anchor="middle">含隔墙的实际占用面积更大，须现场放样</text><line x1="530" y1="60" x2="530" y2="475" stroke="#bdc9bc" stroke-width="2" stroke-dasharray=""/><text x="700" y="28" font-size="21" fill="#233d36" text-anchor="middle">L02 阳台B · 首选</text><rect x="578" y="70" width="225" height="266" rx="0" fill="#e9ece6" stroke="#233d36" /><rect x="636" y="83" width="146" height="111" rx="0" fill="#d8decf" stroke="#82958c" /><text x="709" y="126" font-size="17" fill="#233d36" text-anchor="middle">洗烘叠放</text><text x="709" y="159" font-size="14" fill="#233d36" text-anchor="middle">阀门可达</text><rect x="639" y="260" width="141" height="60" rx="0" fill="#ead5b7" stroke="#82958c" /><text x="710" y="294" font-size="16" fill="#233d36" text-anchor="middle">机器人基站</text><text x="600" y="233" font-size="13" fill="#233d36" text-anchor="middle">前场</text><text x="691" y="371" font-size="14" fill="#233d36" text-anchor="middle">门、窗、洗烘和基站共同放样</text><text x="691" y="404" font-size="14" fill="#ac6537" text-anchor="middle">清扫时开厨房门与阳台门</text><text x="987" y="28" font-size="21" fill="#233d36" text-anchor="middle">R01 原公卫 · 备选</text><rect x="868" y="70" width="230" height="266" rx="0" fill="#e5eff0" stroke="#233d36" /><rect x="879" y="83" width="204" height="80" rx="0" fill="#d8decf" stroke="#82958c" /><text x="982" y="117" font-size="16" fill="#233d36" text-anchor="middle">台盆柜干区条件位</text><text x="982" y="145" font-size="14" fill="#233d36" text-anchor="middle">基站按型号安排</text><line x1="879" y1="205" x2="1085" y2="205" stroke="#427f9a" stroke-width="2" stroke-dasharray="5 4"/><text x="982" y="245" font-size="16" fill="#233d36" text-anchor="middle">马桶 / 淋浴不挤占</text><text x="982" y="285" font-size="15" fill="#233d36" text-anchor="middle">保防水与挡水</text><text x="984" y="370" font-size="14" fill="#233d36" text-anchor="middle">图注3.7㎡，不是已确认放得下</text><text x="984" y="404" font-size="14" fill="#ac6537" text-anchor="middle">清扫时开公卫门，避免淋浴溅水</text><text x="812" y="454" font-size="18" fill="#233d36" text-anchor="middle">两处二选一；不另做公共区壁龛</text><text x="580" y="514" font-size="16" fill="#ac6537" text-anchor="middle">所有符号为功能关系；没有实测门窗、管道与净尺寸，不表示已核定设备安装位。</text></g></svg>