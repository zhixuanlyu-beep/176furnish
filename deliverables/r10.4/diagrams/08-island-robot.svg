asharray="6 4" /><rect x="195.795" y="181.705" width="236.364" height="295.455" fill="none" stroke="#467896" stroke-width="1.4" stroke-dasharray="6 4" /><rect x="491.25" y="299.886" width="177.273" height="177.273" fill="none" stroke="#467896" stroke-width="1.4" stroke-dasharray="6 4" /></g><rect x="195.795" y="477.159" width="236.364" height="221.591" fill="none" stroke="#467896" stroke-width="1.4" stroke-dasharray="6 4" /><text x="313.977" y="572.955" font-size="15" fill="#233e38" text-anchor="middle">基站模块800</text><rect x="432.159" y="477.159" width="236.364" height="221.591" fill="none" stroke="#467896" stroke-width="1.4" stroke-dasharray="6 4" /><text x="550.341" y="572.955" font-size="15" fill="#233e38" text-anchor="middle">水槽模块800</text><rect x="201.705" y="491.932" width="224.545" height="192.045" fill="none" stroke="#467896" stroke-width="1.4" stroke-dasharray="6 4" /><text x="313.977" y="617.955" font-size="15" fill="#233e38" text-anchor="middle">净预留760×650</text><text x="840" y="170" font-size="18" fill="#233e38" text-anchor="start">基站净高：650mm（概念）</text><text x="840" y="221" font-size="18" fill="#233e38" text-anchor="start">开口朝北／厨房</text><text x="840" y="272" font-size="18" fill="#233e38" text-anchor="start">前方检查区：800×1000</text><text x="840" y="323" font-size="18" fill="#233e38" text-anchor="start">岛台高900；餐桌高750</text><text x="840" y="374" font-size="18" fill="#233e38" text-anchor="start">桌面与岛台高差150</text><text x="840" y="425" font-size="18" fill="#233e38" text-anchor="start">原岛槽位置不变</text><text x="840" y="476" font-size="18" fill="#233e38" text-anchor="start">阀门、接头、电源可达</text><text x="840" y="527" font-size="18" fill="#233e38" text-anchor="start">与水槽柜分隔、整机可抽出</text><text x="840" y="578" font-size="18" fill="#233e38" text-anchor="start">重力排水条件未成立</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">柜体分格是概念预留；厂家净尺寸、进出距离、上盖取件和散热要求需要按型号替换。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">基站活动区与携篮／备菜人员可能重叠；不能把检查区当作持续空闲的走道。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">岛槽排水与基站排水分别核定；基站泵排能力不证明岛槽重力排水可行。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.4 为二维调整；现有三维效果图对应 R10.2。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>