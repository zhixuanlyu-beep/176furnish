text-anchor="middle">1500门洞保留</text><text x="965" y="150" font-size="16" fill="#233e38" text-anchor="start">高鞋柜：900×400×2400</text><text x="965" y="197" font-size="16" fill="#233e38" text-anchor="start">面向玄关，南面Y2724</text><text x="965" y="244" font-size="16" fill="#233e38" text-anchor="start">柜背Y3124，浅柜Y3174</text><text x="965" y="291" font-size="16" fill="#233e38" text-anchor="start">两柜间隔50</text><text x="965" y="338" font-size="16" fill="#233e38" text-anchor="start">主门全开板面间隔87.5</text><text x="965" y="385" font-size="16" fill="#233e38" text-anchor="start">50把手后余37.5</text><text x="965" y="432" font-size="16" fill="#233e38" text-anchor="start">再计10安装余量：27.5</text><text x="965" y="479" font-size="16" fill="#233e38" text-anchor="start">浅柜：450×1176×2300</text><text x="965" y="526" font-size="16" fill="#233e38" text-anchor="start">双移门，轨道包含在柜深内</text><text x="965" y="573" font-size="16" fill="#233e38" text-anchor="start">南段取物：关主门／错时</text><text x="965" y="620" font-size="16" fill="#233e38" text-anchor="start">北段取物：保留常用书物</text><text x="965" y="667" font-size="16" fill="#233e38" text-anchor="start">书桌、大件柜、门位保持</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">橙线：柜门投影／房门运动；蓝框：600mm深人员操作带；红线：概念把手突出量。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">鞋柜开门与入户携篮通道重叠；浅柜南段操作与家庭厅主门全开重叠，分别错时。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">不设置柜内换鞋凳；鞋柜把手采用≤5mm嵌入式，最终门套、五金和安装余量须放样。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.4 为二维调整；现有三维效果图对应 R10.2。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>