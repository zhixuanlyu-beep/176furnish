"534.0" stroke="#34735e"/><line x1="794.0000000000001" y1="435.99999999999994" x2="994.0000000000001" y2="435.99999999999994" stroke="#34735e"/><line x1="794.0000000000001" y1="323.99999999999994" x2="994.0000000000001" y2="323.99999999999994" stroke="#34735e"/><line x1="794.0000000000001" y1="240.0" x2="994.0000000000001" y2="240.0" stroke="#34735e"/><text x="894" y="830" font-size="15" fill="#233e38" text-anchor="middle">800外宽／764净宽</text><rect x="32" y="851" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="875" font-size="16" fill="#233e38" text-anchor="start">四模块、18mm侧板：柜内净宽合计3056mm；不包含门板／背板／安装误差后的现场修正。</text><text x="48" y="904" font-size="16" fill="#233e38" text-anchor="start">三个挂衣模块净宽合计2292mm；两组双层短衣＋一组长衣，概念挂杆总长3820mm。</text><text x="48" y="933" font-size="16" fill="#233e38" text-anchor="start">第四模块为抽屉／层板；柜门每模块两扇、每扇400mm；衣帽区属于开放过道。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.4 为二维调整；现有三维效果图对应 R10.2。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>