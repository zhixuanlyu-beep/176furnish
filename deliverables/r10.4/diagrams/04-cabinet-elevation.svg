<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img"><title>南墙立面与设备高度</title><rect width="100%" height="100%" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="48" font-size="27" fill="#233e38" text-anchor="start">R10.4  /  南墙立面与设备高度</text><text x="42" y="79" font-size="15" fill="#b36b36" text-anchor="start">单位：mm · 概念尺寸，非现场实测／下单尺寸</text><rect x="120" y="530" width="540" height="270" fill="#e0e9df" stroke="#34735e" stroke-width="1.4" /><text x="390" y="828" font-size="17" fill="#233e38" text-anchor="middle">咖啡柜 1800.0</text><rect x="660" y="140" width="180" height="660" fill="#e0e9df" stroke="#34735e" stroke-width="1.4" /><text x="750" y="828" font-size="17" fill="#233e38" text-anchor="middle">电器高柜 600.0</text><rect x="840" y="140" width="292.5" height="660" fill="#e0e9df" stroke="#34735e" stroke-width="1.4" /><text x="986.25" y="828" font-size="17" fill="#233e38" text-anchor="middle">冰箱 975.0</text><rect x="663.6" y="470" width="172.8" height="135" fill="#d4dce0" stroke="#467896" stroke-width="1.4" /><text x="750" y="537.5" font-size="15" fill="#233e38" text-anchor="middle">蒸烤一体机</text><rect x="663.6" y="326" width="172.8" height="114" fill="#d4dce0" stroke="#467896" stroke-width="1.4" /><text x="750" y="383" font-size="15" fill="#233e38" text-anchor="middle">嵌入式微波炉</text><text x="1150" y="605" font-size="15" fill="#467896" text-anchor="start">蒸烤底650</text><text x="1150" y="470" font-size="15" fill="#467896" text-anchor="start">蒸烤顶1100</text><text x="1150" y="440" font-size="15" fill="#467896" text-anchor="start">微波底1200</text><text x="1150" y="326" font-size="15" fill="#467896" text-anchor="start">微波顶1580</text><rect x="32" y="831" width="1336" height="115" fill="#eef1e8" stroke="none" stroke-width="1.4" /><text x="48" y="855" font-size="16" fill="#233e38" text-anchor="start">高柜2200高；蒸烤450高、底650；微波380高、底1200。上下均为概念机体占位。</text><text x="48" y="884" font-size="16" fill="#233e38" text-anchor="start">两设备之间100mm区域用于承托／间隔概念表达，不是厂家确认的散热构造。</text><text x="48" y="913" font-size="16" fill="#233e38" text-anchor="start">咖啡机与磨豆机移至左侧咖啡柜；右侧600mm台面留作放盘，原台面微波炉已取消。</text><text x="42" y="1030" font-size="12" fill="#b36b36" text-anchor="start">R10.4 为二维调整；现有三维效果图对应 R10.2。红色／虚线表示开启或使用范围，不能视为实体。</text></g></svg>