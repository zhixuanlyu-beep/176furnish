<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-label="四组柜体检修关系示意"><g font-family="Microsoft YaHei, sans-serif"><text x="140" y="28" font-size="18" fill="#233d36" text-anchor="middle">J01 水槽＋洗碗机</text><rect x="20" y="48" width="240" height="267" rx="0" fill="#f9f8f2" stroke="#82958c" /><text x="420" y="28" font-size="18" fill="#233d36" text-anchor="middle">J02 冰箱／可选蒸烤柜</text><rect x="300" y="48" width="240" height="267" rx="0" fill="#f9f8f2" stroke="#82958c" /><text x="700" y="28" font-size="18" fill="#233d36" text-anchor="middle">J03 叠放洗烘</text><rect x="580" y="48" width="240" height="267" rx="0" fill="#f9f8f2" stroke="#82958c" /><text x="980" y="28" font-size="18" fill="#233d36" text-anchor="middle">J04 机器人基站</text><rect x="860" y="48" width="240" height="267" rx="0" fill="#f9f8f2" stroke="#82958c" /><rect x="30" y="70" width="125" height="147" rx="0" fill="#dfe9e0" stroke="#82958c" /><text x="92" y="100" font-size="16" fill="#233d36" text-anchor="middle">水槽柜</text><text x="92" y="134" font-size="13" fill="#233d36" text-anchor="middle">阀门／插座可达</text><text x="92" y="164" font-size="13" fill="#233d36" text-anchor="middle">净水＋分类桶</text><text x="92" y="194" font-size="13" fill="#233d36" text-anchor="middle">厨余仅预留</text><rect x="164" y="70" width="86" height="147" rx="0" fill="#eee4d2" stroke="#82958c" /><text x="207" y="125" font-size="15" fill="#233d36" text-anchor="middle">洗碗机</text><text x="207" y="158" font-size="14" fill="#233d36" text-anchor="middle">600级</text><line x1="164" y1="227" x2="250" y2="227" stroke="#ac6537" stroke-width="3" stroke-dasharray="6 4"/><text x="140" y="272" font-size="15" fill="#ac6537" text-anchor="middle">门全开＋整机前抽 ↓</text><rect x="310" y="70" width="105" height="186" rx="0" fill="#dfe9e0" stroke="#82958c" /><text x="362" y="141" font-size="17" fill="#233d36" text-anchor="middle">冰箱</text><text x="362" y="178" font-size="12" fill="#233d36" text-anchor="middle">铰链侧余量</text><rect x="432" y="70" width="97" height="186" rx="0" fill="#eee4d2" stroke="#82958c" /><rect x="440" y="119" width="81" height="70" rx="0" fill="#fff" stroke="#82958c" /><text x="480" y="149" font-size="14" fill="#233d36" text-anchor="middle">蒸烤箱</text><text x="480" y="177" font-size="12" fill="#ac6537" text-anchor="middle">条件位</text><text x="420" y="289" font-size="12" fill="#ac6537" text-anchor="middle">两者为模块示意，非指定并排</text><rect x="630" y="62" width="140" height="113" rx="0" fill="#dfe9e0" stroke="#82958c" /><rect x="630" y="184" width="140" height="113" rx="0" fill="#dfe9e0" stroke="#82958c" /><circle cx="700" cy="118" r="32" fill="white" stroke="#82958c"/><circle cx="700" cy="240" r="32" fill="white" stroke="#82958c"/><text x="700" y="124" font-size="17" fill="#233d36" text-anchor="middle">烘</text><text x="700" y="246" font-size="17" fill="#233d36" text-anchor="middle">洗</text><line x1="630" y1="179" x2="770" y2="179" stroke="#ac6537" stroke-width="5" stroke-dasharray=""/><text x="822" y="113" font-size="13" fill="#233d36" text-anchor="middle">阀</text><text x="822" y="137" font-size="13" fill="#233d36" text-anchor="middle">电</text><text x="822" y="161" font-size="12" fill="#233d36" text-anchor="middle">可达</text><text x="700" y="338" font-size="14" fill="#ac6537" text-anchor="middle">连接件＋顶部拆机包络</text><rect x="888" y="78" width="181" height="105" rx="0" fill="#dfe9e0" stroke="#82958c" /><text x="978" y="128" font-size="17" fill="#233d36" text-anchor="middle">收纳柜</text><rect x="911" y="204" width="131" height="94" rx="0" fill="#eee4d2" stroke="#82958c" /><text x="976" y="240" font-size="17" fill="#233d36" text-anchor="middle">基站</text><text x="976" y="268" font-size="13" fill="#233d36" text-anchor="middle">低位开放</text><line x1="894" y1="314" x2="1060" y2="314" stroke="#ac6537" stroke-width="3" stroke-dasharray="6 4"/><text x="980" y="341" font-size="13" fill="#ac6537" text-anchor="middle">托盘／尘袋抽取方向依型号</text><text x="143" y="371" font-size="14" fill="#233d36" text-anchor="middle">邻柜检修；管线不挡抽机</text><text x="420" y="371" font-size="14" fill="#233d36" text-anchor="middle">开孔与通风严格按厂家</text><text x="700" y="371" font-size="14" fill="#233d36" text-anchor="middle">过滤器可取；两机分别搬出</text><text x="978" y="371" font-size="14" fill="#233d36" text-anchor="middle">前场不能兼作固定储物</text><text x="560" y="423" font-size="15" fill="#ac6537" text-anchor="middle">图示只表达设备与检修关系；所有宽深高、开孔、散热和维修包络以候选型号安装图＋现场净尺寸锁定。</text></g></svg>