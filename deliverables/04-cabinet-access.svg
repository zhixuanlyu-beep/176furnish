.8" y="345" font-size="15" fill="#233d36" text-anchor="middle">咖啡机</text><text x="758" y="267" font-size="14" fill="#233d36" text-anchor="middle">磨豆 / 接水 / 手动倒废水</text><text x="575" y="580" font-size="16" fill="#ac6537" text-anchor="middle">净墙长扣端部、背部散热及厂家安装余量后定食品柜；3976仅为原图参考。</text><text x="575" y="611" font-size="15" fill="#233d36" text-anchor="middle">算例两端各100，冰箱深750，其余600；高柜高度与吊顶、梁及设备安装图协调。</text><text x="575" y="640" font-size="15" fill="#ac6537" text-anchor="middle">蒸箱与烤箱必配且分体；不适合叠装时重新分配高柜模块，仍保留两台。</text></g></svg>